# Displayname template for Google Chat ghost users.
# Variables: .Name (full name), .FirstName, .Email
displayname_template: '{{ or .Name .Email "Unknown user" }} (Google Chat)'
# How many most-recently-active chats to create portals for after login.
initial_chat_sync: 20
# Refuse to send Matrix media to Google Chat. Only useful if uploads start
# failing for your account and you prefer a clear error.
disable_outbound_media: false
# Don't download and inline the media a link chip points at (a GIF, a link
# preview image); the link is still in the message. The bridge only fetches
# the address Google supplies, over https, without cookies or proxy, and
# never from internal addresses.
disable_inline_url_media: false
# Make the `leave` command act at once instead of waiting for `leave confirm`.
# Leaving a private space can't be undone without a new invite.
skip_leave_confirmation: false
# History backfill is configured in the top-level `backfill:` section.
