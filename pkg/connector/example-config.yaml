# Displayname template for Google Chat ghost users.
# Variables: .Name (full name), .FirstName, .Email
displayname_template: '{{ or .Name .Email "Unknown user" }} (Google Chat)'
# How many most-recently-active chats to create portals for after login.
initial_chat_sync: 20
# Disable sending Matrix media (images/files/video/audio) to Google Chat.
# Google's /uploads endpoint has reportedly returned HTTP 500 for every
# upload since ~Feb 2026 (unsupported, see upstream issue
# https://github.com/mautrix/googlechat/issues/114). Enable this if outbound
# media is failing against your account and you'd rather get an immediate,
# clear rejection than a failed send attempt every time.
disable_outbound_media: false
# History (message) backfill has no settings here: it is controlled entirely
# by this bridge's standard top-level `backfill:` section (not part of this
# network-specific config fragment) -- see that section's own comments, and
# pkg/connector/backfill.go's defaultFetchMessagesCount doc comment for which
# of its keys actually reaches this connector.
