name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    name: Build & test (Go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Layering check (gchatmeow must not import bridgev2)
        run: '! grep -rn "maunium.net/go/mautrix" pkg/gchatmeow/ --include="*.go" | grep -v _test.go | grep -v "googlechat.pb.go"'
      - name: Layering check (connector must not do HTTP)
        run: '! grep -rn "\"net/http\"" pkg/connector/ --include="*.go" | grep -v _test.go'
      - name: Build
        run: go build -tags goolm ./...
      - name: Vet
        run: go vet -tags goolm ./...
      - name: Test
        run: go test -tags goolm ./...
      - name: Test (race detector, connector)
        run: go test -tags goolm -race ./pkg/connector/...
