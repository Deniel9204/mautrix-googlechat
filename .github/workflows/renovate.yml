name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    name: Run Renovate
    steps:
      - uses: actions/checkout@v7

      # Self-hosted so it actually runs hourly (the hosted app decides its
      # own cadence). Repo-level behavior (patch automerge etc.) lives in
      # renovate.json; PRs are created with the RENOVATE_TOKEN PAT so they
      # trigger the normal CI workflows.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.21
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: info
