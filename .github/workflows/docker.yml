name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    name: Build & push image
    steps:
      - uses: actions/checkout@v7

      # Git tags are v0.YYMM.PATCH (mautrix CalVer); docker version tags use
      # the v-prefixed calendar form like upstream mautrix bridges
      # (v0.2607.3 -> :v26.07.3 + :v26.07).
      - name: Calendar version tags
        id: calver
        if: startsWith(github.ref, 'refs/tags/v0.')
        run: |
          raw="${GITHUB_REF_NAME#v0.}"
          yymm="${raw%%.*}"
          patch="${raw#*.}"
          echo "full=v${yymm:0:2}.${yymm:2:2}.${patch}" >> "$GITHUB_OUTPUT"
          echo "short=v${yymm:0:2}.${yymm:2:2}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=raw,value=${{ steps.calver.outputs.full }},enable=${{ steps.calver.outputs.full != '' }}
            type=raw,value=${{ steps.calver.outputs.short }},enable=${{ steps.calver.outputs.short != '' }}
            type=sha,format=short

      - name: Build timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # binfmt emulation for the final-stage `RUN apk add` under linux/arm64;
      # the Go build itself is cross-compiled natively via tonistiigi/xx.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'unknown' }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
